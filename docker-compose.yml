version: '3.8'

services:
  codesnippetvault:
    build: .
    ports:
      - "3002:3002"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-S", "http://localhost:3002/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
